defaults:
  - base
  - _self_

# Tandem repeat benchmark (v2).
# Two-stage strategy:
#   1) random initialization + MCMC to form approximate internal repeat geometry
#   2) switch to LigandMPNN once repeats are reasonably self-consistent

task_name: ???
out_dir: ???
repeats: 1

seqs:
  A: ???

steps: 100
initial_temperature: 0.03

predocker:
  predocker_terms:
    symmetry:
      _type: symmetry_canonicalizer
      mode: tandem_repeat
      oligo: A
      included_protomer: A
      backend: legacy
      repeat_canonicalizer_mode: helical

mutator:
  names: ["mcmc_symmetry", "ligand_mpnn_refine"]
  selector_expression: null
  mutator_terms:
    mcmc_symmetry:
      _type: MCMC
      mutation_method: frequency_adjusted
      select_positions: random
    ligand_mpnn_refine:
      _type: LigandMPNN
      model_type: soluble_mpnn
      temperature: 0.3
      predocker: ["symmetry"]

evaluator:
  evaluator_terms:
    Alphafold3:
      _type: Alphafold3
    Alphafold2:
      _type: alphafold2

loss:
  loss_terms:
    A_single_chain_rog:
      _type: single_chain_rog
      included_protomers: A
    repeat_unit_rmsd_raw:
      _type: repeat_unit_rmsd_raw
    repeat_unit_rmsd_norm:
      _type: repeat_unit_rmsd_norm
      best: 0.0
      worst: 1.0
  expression_terms:
    A_globular_target: 0.395 * (A_length ** 0.6) + 7.257

stages:
  default:
    oligo: ["A"]
    evaluator: Alphafold3
    mutation_num: 10%
    mutators: ["mcmc_symmetry"]
    mutator_weights: [1.0]
    weighted_score_expression: 0.5 * plddt + 0.25 * ptm + repeat_unit_rmsd_norm - 0.2 * (1 / (1 + exp(-((A_single_chain_rog - A_globular_target) / 5.0))))
    acceptance_threshold: null
    early_stopping: null
  refine:
    _entrance: (repeat_unit_rmsd_raw <= 1.0) and (plddt >= 0.7)
    oligo: ["A"]
    evaluator: Alphafold3
    mutation_num: 100%
    acceptance_threshold: null
    mutators: ["ligand_mpnn_refine"]
    mutator_weights: [1.0]
    weighted_score_expression: plddt + ptm + 0.8 * repeat_unit_rmsd_norm - 0.2 * (1 / (1 + exp(-((A_single_chain_rog - A_globular_target) / 5.0))))
    early_stopping: (repeat_unit_rmsd_raw <= 0.2) and (plddt >= 0.85)
