  notes:
    - The fresh50 cohort extends the native r21 configurations to 50 steps. Archived oriented arms use iptm + ptm + plddt + ligand_burial + pocket_occupancy - holes, rather than the current manuscript iptm + pocket_occupancy.
    - Archived rescue also triggers during steps 0 and 1, filters poses at occupancy >= 0.8, and permits two retries at exhaustiveness 16. The current manuscript protocol has no pose filter or retries.
    - Native Metropolis acceptance at initial temperature 0.03 and the input sequence masks are retained. These archived settings run on the maintained backend with its corrected coordinate mapping and first-rank pose selection.
initial_temperature: 0.03
use_metropolis_acceptance: true
enable_pyrosetta: true
