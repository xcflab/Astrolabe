defaults:
  - /paper/pocket_iptm
  - _self_

paper_protocol:
  source: 007_halludesign_proteinhunter_bench/004_pocket_refine_dynamically/config/002_catm_liga_matched_rebuild/01_paired_seed_full_rebuild/01_six_cell_fresh50/01_prepare_and_accept.py
  source_config: 007_halludesign_proteinhunter_bench/004_pocket_refine_dynamically/config/44_target_selection_v3_catm_liga_30run_completion/ty3_catm_liga_30run_completion1/configs/arm_d/CatM_muconate_only_to_BenM_like_benzoate_response_predocker_r21.yaml
