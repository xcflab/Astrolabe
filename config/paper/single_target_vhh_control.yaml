# @package _global_
defaults:
- /base
- _self_
task_name: single_target_vhh_control
out_dir: null
seed: 1
steps: 100
repeats: 1
enable_pyrosetta: true
use_metropolis_acceptance: true
initial_temperature: 0.03
seqs:
  A: +EVQLVESGGGLVQPGGSLRLSCAAS 7-11 +GWFRQAPGKGRELVAAI 6-10 +YPDSVEGRFTISRDNAKRMVYLQMNSLRAEDTAVYYCA 15-28 +GQGTQVTVSS
  B: ???
homologies:
  A:
    _type: antibody_framework_homology
    framework_name: vhh__boltzgen_7eow
    source: ${oc.env:ASTROLABE_PAPER_DATA}/protein/frameworks/vhh__boltzgen_7eow.json:A
    layout:
      fixed_segments:
      - EVQLVESGGGLVQPGGSLRLSCAAS
      - GWFRQAPGKGRELVAAI
      - YPDSVEGRFTISRDNAKRMVYLQMNSLRAEDTAVYYCA
      - GQGTQVTVSS
      loop_order:
      - H1
      - H2
      - H3
      source_loop_lengths:
        H1: 9
        H2: 8
        H3: 21
  B: ???
initializer:
  mode: x_mix
  x_fraction: 1.0
  aa_set: null
reinitialize_random_segments_with_dplm: false
mutator:
  selector_expression: null
  mutator_terms:
    LigandMPNN_itf:
      _type: LigandMPNN
      temperature: 0.5
      position_selector: interface(interface_distance=10.0)
      fallback_to_all_mutable_if_selector_empty: false
    LigandMPNN_noitf:
      _type: LigandMPNN
      temperature: 0.3
      position_selector: not interface(interface_distance=10.0)
      fallback_to_all_mutable_if_selector_empty: false
    dplm:
      _type: DPLM
      temperature: 1
  DPLM:
    max_iter: 400
    model_name: airkingbd/dplm_650m
    num_samples: 1
loss:
  loss_terms:
    binder_rog:
      _type: single_chain_rog
      included_protomers: A
    binder_loop_frac:
      _type: secondary_structure_fraction
      included_protomers: A
      sse_type: L
    interface_sc:
      _type: protomer_shape_complementarity
  expression_terms:
    globin_rog: 0.395 * (A_length ** 0.6) + 7.257
    shape_penalty: 0.3 * sigmoid((binder_rog - globin_rog) / 5.0) + 0.6 * min(binder_loop_frac, 1.0)
stages:
  default:
    oligo:
    - A
    evaluator: Alphafold3
    mutators:
    - dplm
    mutation_num: 100%
    weighted_score_expression: -0.4 * sigmoid((binder_rog - globin_rog) / 5.0) - 0.6 * min(binder_loop_frac, 1.0)
    acceptance_threshold: (binder_loop_frac < 0.4) and (binder_rog <= globin_rog + 3)
    early_stopping: null
  complex:
    oligo:
    - AB
    evaluator: Alphafold3
    mutators:
    - LigandMPNN_itf
    - LigandMPNN_noitf
    mutation_num: 100%
    weighted_score_expression: iptm + 0.4 * ptm + plddt + 0.2 * interface_sc - shape_penalty
    acceptance_threshold: null
    early_stopping: null
    _entrance: (binder_loop_frac < 0.4) and (binder_rog <= globin_rog + 3)
    mutator_weights:
    - 1.0
    - 1.0
evaluator:
  evaluator_terms:
    Alphafold3:
      _type: Alphafold3
pre_eval_hooks:
  af3_antibody_msa_cache:
    enabled: true
    require_msa_payload: true
    chain_ids:
    - A
    af3_turboab_db_subset: VHH
    clear_paired_msa: true
    preserve_existing_templates: true
    expected_template_count: 4
    minimum_unpaired_msa_sequences: 2
    dump_final_input_json: true
    af3_turboab_db_dir: ${oc.env:ASTROLABE_TURBOAB_DB}
    data_pipeline_command:
    - ${oc.env:ASTROLABE_AF3_PYTHON,python}
    - ${oc.env:ASTROLABE_AF3_DATA_PIPELINE}
    - --json_path
    - '{json_path}'
    - --output_dir
    - '{output_dir}'
    - --db_dir
    - '{db_dir}'
    - --norun_inference
    - --force_output_dir
    - --jackhmmer_n_cpu
    - '8'
    - --nhmmer_n_cpu
    - '8'
paper_protocol:
  source:
  - MainPaper 95-99,152-158 (2026-10-09 Methods snapshot)
  - SI 51-54
  representative: last_accepted
  notes:
  - 'Two-stage control: all-X CDR initialization, DPLM monomer shaping, then LigandMPNN complex optimization; fixed
    framework segments are never mutable.'
  - The CDR-restricted single-target control uses the protein-binder benchmark objective and LigandMPNN complex-stage
    mutation routes.
  - Fixed framework and mutable CDR ranges are copied from the formal cohort; all-X CDR initialization.
  - The execution cohort uses Metropolis acceptance with initial temperature 0.03.
  - The AF3-TurboAb hook requires ASTROLABE_TURBOAB_DB and an AF3 data-pipeline script via ASTROLABE_AF3_DATA_PIPELINE
    (optional ASTROLABE_AF3_PYTHON).
  required_input_paths:
  - homologies.A.source
  - homologies.B
  - pre_eval_hooks.af3_antibody_msa_cache.af3_turboab_db_dir
  framework: vhh_7eow
  cdr_initializer: all-x
  planned_runs_per_direction: 50
