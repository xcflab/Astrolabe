# @package _global_
defaults:
- /base
- _self_
task_name: cyclic_peptide
out_dir: null
repeats: 1
steps: 30
seed: 1
seqs:
  A: 9-20
  B: ???
homologies:
  B: null
enable_pyrosetta: false
mutator:
  selector_expression: null
  mutator_terms:
    mpnn:
      _type: LigandMPNN
      temperature: 0.5
evaluator:
  evaluator_terms:
    Alphafold3:
      _type: Alphafold3
cyclization:
  bonds: ???
  encoding:
    scope: all_bonds
  signal_mode: both
loss:
  loss_terms:
    cyclic_closure_norm:
      _type: cyclic_closure_norm
      sigma: 0.2
      aggregate: min
    closure_all_bonds:
      _type: cyclic_all_bonds_within_error
      margin: 0.3
    closure_max_error:
      _type: cyclic_max_bond_error
stages:
  default:
    oligo:
    - AB
    evaluator: Alphafold3
    mutators:
    - mpnn
    mutation_num: 100%
    weighted_score_expression: iptm + 0.3 * cyclic_closure_norm
    acceptance_threshold: cyclic_closure_norm >= 0.9
    early_stopping: null
paper_protocol:
  source:
  - MainPaper 190-196
  - SI 75-89
  representative: max_objective
  notes:
  - Supply exact atom-level linkages, target distances and any required modified residues.
  - Continuous optimization closure and all-bond absolute-error <=0.30 A endpoint
    are separate metrics.
  - LigandMPNN proposals apply to every linkage chemistry. The historical standard-residue
    LigandMPNN/SolubleMPNN mixture is retained in cyclic-peptide-bound-archived.
  recipe_kind: manuscript
initial_temperature: 0.03
reinitialize_random_segments_with_dplm: false
skip_complex_poses: true
