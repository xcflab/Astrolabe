# Canonical source ownership inventory for third-party code used by GH.
#
# This file complements `.gitmodules` and `config/third_party_envs.yaml`.
# Keep one source owner per component:
# - official_submodule_plus_patch: upstream submodule plus repo-owned patch.
# - fork_backed_submodule: `.gitmodules` points at a GH-maintained fork.
# - fork_backed_submodule_plus_patch: fork plus a small local patch overlay.
# - official_submodule: upstream submodule with no repo-owned patch.
# Branch-backed entries also pin expected_commit so the superproject gitlink
# cannot silently remain on an upstream ancestor instead of the reviewed branch.
#
# Fork candidates must stay explicit until their `.gitmodules` URL is migrated
# to a reviewed fork and the local patch is removed or reduced to a small overlay.

components:
  abseil_cpp_source:
    path: vendor/abseil-cpp-source
    source_mode: official_submodule
    expected_url: https://github.com/abseil/abseil-cpp.git
    patch_group: null
    fork_candidate: false
    migration_status: upstream_owned
    reason: AlphaFold3 C++ build dependency vendored for offline builds.

  alphafold2:
    path: vendor/alphafold2
    source_mode: official_submodule_plus_patch
    expected_url: https://github.com/google-deepmind/alphafold.git
    expected_commit: c77e5d2a8961d1a353632c462914ff0a32a950f6
    patch_group: alphafold2
    fork_candidate: false
    migration_status: patch_owned
    reason: Public base plus the complete tracked patch reproduces local 4a959fffece926497454d421b12702bd7576179a, including chain confidence, recycle state, cyclic offsets and packaging.

  alphafold3:
