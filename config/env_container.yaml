# @package _global_

weight_path:
  ligandmpnn: ${oc.env:GH_WEIGHT_LIGANDMPNN,/models/ligandmpnn}
  rapidock: ${oc.env:GH_WEIGHT_RAPIDOCK,null}
  alphafold3: ${oc.env:GH_WEIGHT_AF3,/models/alphafold3}
  alphafold: ${oc.env:GH_WEIGHT_AF2,/models/alphafold2}
  rf3: ${oc.env:GH_WEIGHT_RF3,/models/rf3/model.pt}
  rfd3: ${oc.env:GH_WEIGHT_RFD3,/models/rfd3/model.pt}
  protenix: ${oc.env:GH_WEIGHT_PROTENIX,/models/protenix/release_model/protenix-v2.pt}
  protenix_constraint: ${oc.env:GH_WEIGHT_PROTENIX_CONSTRAINT,/models/protenix/release_model/protenix_base_constraint_v0.5.0.pt}
  boltz: ${oc.env:GH_WEIGHT_BOLTZ,/models/boltz}
  opendde: ${oc.env:OPENDDE_ROOT_DIR,/models/opendde}
  surfdesign: ${oc.env:GH_WEIGHT_SURFDESIGN,/models/surfdesign}
  surfpro: ${oc.env:GH_WEIGHT_SURFPRO,/models/surfpro}

protenix:
  ccd_components_file: ${oc.env:GH_PROTENIX_CCD,/models/protenix/release_data/components.v20240608.cif}
  ccd_components_rdkit_mol_file: ${oc.env:GH_PROTENIX_CCD_RDKIT,/models/protenix/release_data/components.v20240608.cif.rdkit_mol.pkl}
rf3:
  repo_path: ${oc.env:GH_RF3_REPO,/ext/foundry}
  ckpt_path: ${weight_path.rf3}
rfd3:
  repo_path: ${rf3.repo_path}
  ckpt_path: ${weight_path.rfd3}

hmmer:
  dir: ${oc.env:GH_HMMER_DIR,null}
  jackhmmer: ${oc.env:GH_JACKHMMER,null}
  nhmmer: ${oc.env:GH_NHMMER,null}
  hmmalign: ${oc.env:GH_HMMALIGN,null}
  hmmsearch: ${oc.env:GH_HMMSEARCH,null}
  hmmbuild: ${oc.env:GH_HMMBUILD,null}

dssp_path: ${oc.env:GH_DSSP,/usr/bin/dssp}
usalign_path: ${oc.env:GH_USALIGN,vendor/usalign/USalign}
ananas_path: ${oc.env:GH_ANANAS,/usr/local/bin/AnAnaS}

obabel_path: ${oc.env:GH_OBABEL,/usr/local/bin/obabel}
molfile_to_params: ${oc.env:GH_MOLFILE_TO_PARAMS,/rosetta/molfile_to_params.py}

subprocess_envs:
  rf3:
    python_bin: ${oc.env:GH_RF3_PYTHON,/ext/foundry/.venv/bin/python}
  opendde:
    python_bin: ${oc.env:GH_OPENDDE_PYTHON,/opt/opendde/bin/python}
    repo_path: ${oc.env:GH_OPENDDE_REPO,/workspace/vendor/opendde}
  surfdesign:
    python_bin: ${oc.env:GH_SURFDESIGN_PYTHON,/envs/surfdesign/bin/python}
    repo_path: ${oc.env:GH_SURFDESIGN_REPO,/ext/surfdesign}
  surfpro:
    python_bin: ${oc.env:GH_SURFPRO_PYTHON,/envs/surfpro/bin/python}
    repo_path: ${oc.env:GH_SURFPRO_REPO,/ext/surfpro}
    msms_bin: ${oc.env:GH_SURFPRO_MSMS,/tools/surfpro/msms/msms}
    pdb_to_xyzrn_bin: ${oc.env:GH_SURFPRO_PDB_TO_XYZRN,/tools/surfpro/pdb_to_xyzrn/pdb_to_xyzrn}
  esmfold2:
    python_bin: ${oc.env:GH_ESMFOLD2_PYTHON,/opt/esmfold2/bin/python}
    esm_repo_path: ${oc.env:GH_ESMFOLD2_ESM_REPO,/workspace/vendor/biohub_esm}
    transformers_repo_path: ${oc.env:GH_ESMFOLD2_TRANSFORMERS_REPO,/workspace/vendor/biohub_transformers}
  rapidock:
    python_bin: ${oc.env:GH_RAPIDOCK_PYTHON,null}
    repo_path: ${oc.env:GH_RAPIDOCK_REPO,null}
  meeko:
    python_bin: ${oc.env:GH_MEEKO_PYTHON,/alphafold3_venv/bin/python}
    pythonpath: ${oc.env:GH_MEEKO_PYTHONPATH,null}
  dplm:
    python_bin: ${oc.env:GH_DPLM_PYTHON,/usr/bin/python3}
    repo_path: ${oc.env:GH_DPLM_REPO,/ext/dplm}
  nampnn:
    python_bin: ${oc.env:GH_NAMPNN_PYTHON,/usr/bin/python3}
    repo_path: ${oc.env:GH_NAMPNN_REPO,/ext/na_mpnn}
  haddock3:
    haddock3_bin: ${oc.env:GH_HADDOCK3_BIN,/usr/bin/haddock3}
  rpxdock:
    python_bin: ${oc.env:GH_RPXDOCK_PYTHON,null}
    repo_path: ${oc.env:GH_RPXDOCK_REPO,null}
    willutil_repo_path: ${oc.env:GH_WILLUTIL_REPO,null}

autodock:
  autodock_gpu_path: ${oc.env:GH_AUTODOCK_GPU,null}
  autogrid4_path: ${oc.env:GH_AUTOGRID4,null}
  vina_path: ${oc.env:GH_VINA,/usr/bin/vina}
  mk_prepare_receptor: ${oc.env:GH_MK_PREPARE_RECEPTOR,/alphafold3_venv/bin/mk_prepare_receptor.py}
  mk_prepare_ligand: ${oc.env:GH_MK_PREPARE_LIGAND,/alphafold3_venv/bin/mk_prepare_ligand.py}

carbondesign:
  repo_path: ${oc.env:GH_CARBONDESIGN_REPO,/ext/carbondesign}
  model_ckpt: ${carbondesign.repo_path}/params/carbondesign_default.ckpt
  model_config: ${carbondesign.repo_path}/config/config_model_mrf_pair_enable_esm_sc.json
  model_features: ${carbondesign.repo_path}/config/config_data_mrf2.json

# Required for config interpolation: base.yaml references ${rhofold.*} even when the
# RhoFold evaluator is not selected.
rhofold:
  checkpoint: ${oc.env:GH_RHOFOLD_CHECKPOINT,/models/rhofold/checkpoint.pt}
  binary_dpath: ${oc.env:GH_RHOFOLD_BIN,/models/rhofold/bin}
  database_dpath: ${oc.env:GH_RHOFOLD_DB,/models/rhofold/db}
