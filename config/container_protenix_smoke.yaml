defaults:
  - base
  - override env: env_container
  - _self_

task_name: sif_protenix_smoke
out_dir: /tmp/gh_protenix_smoke_runs
steps: 2
mutation_num: 0

types:
  A: "p"
seqs:
  A: "ACDEFGHIKLMNPQRSTVWY"

enable_pyrosetta: false
skip_complex_poses: true

evaluator:
  evaluator_terms:
    Protenix:
      _type: Protenix
      use_constraints: false
      diffusion_batch_size: 1
      diffusion_chunk_size: 1
      num_workers: 0
      model:
        N_cycle: 1
      sample_diffusion:
        N_sample: 1
        N_step: 2

mutator:
  mutator_terms:
    MCMC:
      _type: MCMC

loss:
  loss_terms: {}

stages:
  default:
    evaluator: Protenix
    oligo: ["A"]
    mutators: ["MCMC"]
    mutation_num: 0
    weighted_score_expression: "0"
    acceptance_threshold: null
    early_stopping: null
