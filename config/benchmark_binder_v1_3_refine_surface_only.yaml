defaults:
  - base
  - _self_

# Binder refine template (v1.3) - surface-only mutation.
#
# Goal: do NOT mutate interface residues; allow mutation only on surface residues
# away from interface (surface() and not interface()).

task_name: ???
repeats: 10
enable_pyrosetta: true

out_dir: ???
seqs:
  # Binder chain(s): set by CLI / overlay.
  A: ???
  # Target sequence (usually fixed, prefix with '+').
  B: ???

homologies:
  B: null

steps: 10
initial_temperature: 0.03

mutator:
  # Required by `astrolabe/argparser.py` (used to build selector mappings).
  selector_expression: null
  mutator_terms:
    LigandMPNN_surface:
      _type: LigandMPNN
      model_type: soluble_mpnn
      temperature: 0.3
      position_selector: "surface() and not interface(interface_distance=10.0)"
    dplm:
      _type: DPLM
      temperature: 1

evaluator:
  evaluator_terms:
    Alphafold3:
      _type: Alphafold3
    Protenix:
      _type: Protenix
    chai1:
      _type: chai1

loss:
  loss_terms:
    sap_score:
      _type: sap_score
      # By default, score the first binder chain ('A'). For multi-chain binders,
      # override this to a concatenated protomer string, e.g. "ACD".
      included_protomers: A
    ipae_min:
      _type: pae_min
      # `chain_*` defaults to protomer selector; use `chain:<ID>` for explicit complex chain.
      chain_a: A
      chain_b: B
    interface_sc:
      _type: protomer_shape_complementarity

stages:
  default:
    # CLI overrides this to the full oligomer (e.g. "ABC...").
    oligo: ["AB"]
    evaluator: Alphafold3
    mutation_num: 100%
    acceptance_threshold: null
    mutators:
      - LigandMPNN_surface
    mutator_weights:
      - 1.0
    weighted_score_expression: iptm + 0.4*ptm + plddt + interface_sc * 0.2 - 0.01 * sap_score + 0.5 * max(0, 1 - (ipae_min / 10.0))
