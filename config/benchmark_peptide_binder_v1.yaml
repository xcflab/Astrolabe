defaults:
  - base
  - _self_

# Peptide binder benchmark template (v1).
#
# Intended usage:
#   - Prefer the one-shot CLI:
#       gh design peptide-binder --task-name myjob --out-dir outputs --peptide-len 8-16 --target-seq <SEQ>
#   - Or manual override:
#       gh run --task benchmark_peptide_binder_v1 --overlay overlay.yaml
#
# Notes:
#   - Protomer 'A' is the peptide binder (typically short; random length range).
#   - Protomer 'B' is the target protein (typically fixed; prefix with '+').

task_name: ???
repeats: 1
enable_pyrosetta: true

out_dir: ???
seqs:
  # Peptide binder length range.
  A: "8-16"
  # Target protein sequence (usually fixed, prefix with '+').
  B: ???

homologies:
  # Optional; typical convention: inputs/homologies/${target_name}.json:A
  B: ???

steps: 20
initial_temperature: 0.03

mutator:
  # NOTE: `mutator.names` is legacy/ignored; stages reference aliases under `mutator_terms`.
  selector_expression: null
  mutator_terms:
    LigandMPNN_itf:
      _type: LigandMPNN
      temperature: 0.5
      position_selector: "interface(interface_distance=5.0)"
    LigandMPNN_noitf:
      _type: LigandMPNN
      model_type: soluble_mpnn
      temperature: 0.3
      position_selector: "not interface(interface_distance=5.0)"
    dplm:
      _type: DPLM
      temperature: 1

evaluator:
  evaluator_terms:
    Alphafold3:
      _type: Alphafold3
    Protenix:
      _type: Protenix
    chai1:
      _type: chai1
    Boltz:
      _type: boltz
  # Keep Boltz runtime modest for iterative optimization.

loss:
  loss_terms:
    interface_sc:
      _type: protomer_shape_complementarity
    ipsae:
      _type: ipsae
      chain_a: A
      chain_b: B
stages:
  # Single-stage AB optimization; optional binding_site constraints can be injected by CLI overlay.
  default:
    oligo: [ "AB" ]
    evaluator: Protenix
    mutation_num: 100%
    acceptance_threshold: null
    mutators:
      - LigandMPNN_itf
      - LigandMPNN_noitf
    mutator_weights:
      - 1.0
      - 1.0
    weighted_score_expression: iptm + ipsae + 0.4*ptm + 0.5* plddt + interface_sc * 0.2
    early_stopping: null
