defaults:
  - base
  - override env: env_container
  - _self_

task_name: sif_af3_smoke
out_dir: /tmp/gh_af3_smoke_runs
steps: 3
mutation_num: 0

# Protein-only, minimal length to reduce compile/runtime.
types:
  A: "p"
seqs:
  A: "ACDEFGHIKLMNPQRSTVWY"

enable_pyrosetta: false
skip_complex_poses: true

evaluator:
  evaluator_terms:
    Alphafold3:
      _type: Alphafold3
      # Reduce runtime as much as possible
      num_seeds: 1
      num_recycles: 1
      num_samples: 1
      run_data_pipeline: false
      run_inference: true
      # Keep consistent with typical AF3 setups; can be overridden.
      flash_attention_implementation: cudnn

mutator:
  mutator_terms:
    MCMC:
      _type: MCMC

loss:
  loss_terms: {}

stages:
  default:
    evaluator: Alphafold3
    oligo: ["A"]
    mutators: ["MCMC"]
    mutation_num: 0
    weighted_score_expression: "0"
    acceptance_threshold: null
    early_stopping: null
