defaults:
  - base

task_name: test_autodock

# Multiple oligomeric states
types:
  C: "c"
#  B: "r"
seqs:
  A: "SMEEIQKKIKEELEEFLEEAPSLSDIERLTKFLELLTKILENAEYITDEILELLKKTVEELLKLLSPEYASLAKAAYEATLAALEKYKAA"
  B: "EEELLNKLKEAFRKFVTALAKFFSPEMAKLVLELVDTIVEETKTIKDFIELATEFLERLLEVETLEELEELREEILRKLEERKAKE"
  C: "MTX"

mutation_num: 10

predocker:
  predocker_terms:
    dimer_interface:
      _type: dimer_interface_placer
      _for: ABC
    autodock:
      _type: autodock_vina
      exhaustiveness: 9

mutator:
  mutator_terms:
    MCMC:
      _type: MCMC
    LMPNN_wo_center:
      _type: LigandMPNN
    LMPNN_wt_center:
      _type: LigandMPNN
      predocker: [
        dimer_interface,
        autodock
      ]

evaluator:
  evaluator_terms:
    Alphafold3:
      _type: Alphafold3

loss:
  loss_terms:
    bb_buried_frac:
      _type: "buried_fraction_allala"
      _for: ABC
      buried_protomer: C
    lig_com_dist:
      _type: "com_distance"
      _for: ABC
      buried_protomer: C
    sensor_rogs:
      _type: "single_chain_rog"
      included_protomers: AB
    bsa_equality:
      _type: "buried_contribution_diff"
      _for: ABC
      buried_protomer: C
    packing_delta:
      _type: "chain_holes_diff"
      _for: ABC
      buried_protomer: C


stages:
  default:
    oligo: ["ABC"]
    mutators: ["MCMC","LMPNN_wt_center"]
    mutator_weights: [ 0.3, 0.7 ]
    acceptance_threshold: "ABC.plddt > 0.8 and ABC.ptm > 0.8 and ABC.iptm > 0.6 and ABC.bb_buried_frac > 0.6 and ABC.sensor_rogs < 14 and ABC.bsa_equality > 0.6"
    weighted_score_expression: "min(0.9,ABC.plddt) + min(0.9,ABC.ptm) + min(0.8,ABC.iptm) + ABC.bb_buried_frac + max((12 - ABC.lig_com_dist)/12, 0) + max((20 - ABC.sensor_rogs)/10,0) + 0.5 * max(0, min(1,ABC.packing_delta))"