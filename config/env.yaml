# @package _global_

# This file is intentionally portable (publishable).
#
# Configure host-specific paths by either:
# 1) exporting environment variables (recommended), OR
# 2) writing a local overlay like `config/env/env_local.yaml` (gitignored) and
#    overriding via Hydra (see `docs/third_party_envs.md`).
#
# Run a task-aware readiness check:
#   gh env doctor --strict --task <task>

weight_path:
  ligandmpnn: ${oc.env:GH_WEIGHT_LIGANDMPNN,???}
  rapidock: ${oc.env:GH_WEIGHT_RAPIDOCK,???}
  alphafold3: ${oc.env:GH_WEIGHT_AF3,???}
  alphafold: ${oc.env:GH_WEIGHT_AF2,???}
  rf3: ${oc.env:GH_WEIGHT_RF3,???}
  rfd3: ${oc.env:GH_WEIGHT_RFD3,???}
  protenix: ${oc.env:GH_WEIGHT_PROTENIX,???}
  protenix_constraint: ${oc.env:GH_WEIGHT_PROTENIX_CONSTRAINT,???}
  boltz: ${oc.env:GH_WEIGHT_BOLTZ,???}
  # OpenDDE root directory containing checkpoint/, common/, and optionally search_database/.
  opendde: ${oc.env:OPENDDE_ROOT_DIR,???}
  # SurfDesign trained experiment containing .hydra/config.yaml and checkpoints/.
  surfdesign: ${oc.env:GH_WEIGHT_SURFDESIGN,???}
  # SurfPro checkpoint directory containing checkpoint_best.pt.
  surfpro: ${oc.env:GH_WEIGHT_SURFPRO,???}
protenix:
  ccd_components_file: ${oc.env:GH_PROTENIX_CCD,???}
  ccd_components_rdkit_mol_file: ${oc.env:GH_PROTENIX_CCD_RDKIT,???}
rf3:
  repo_path: ${oc.env:GH_RF3_REPO,???}
  ckpt_path: ${weight_path.rf3}
rfd3:
  repo_path: ${rf3.repo_path}
  ckpt_path: ${weight_path.rfd3}

hmmer:
  dir: ${oc.env:GH_HMMER_DIR,/usr/bin}
  jackhmmer: ${hmmer.dir}/jackhmmer
  nhmmer: ${hmmer.dir}/nhmmer
  hmmalign: ${hmmer.dir}/hmmalign
  hmmsearch: ${hmmer.dir}/hmmsearch
  hmmbuild: ${hmmer.dir}/hmmbuild

dssp_path: ${oc.env:GH_DSSP,./vendor/mkdssp}
usalign_path: ${oc.env:GH_USALIGN,./vendor/usalign/USalign}
ananas_path: ${oc.env:GH_ANANAS,???}

obabel_path: ${oc.env:GH_OBABEL,/usr/bin/obabel}
molfile_to_params: ${oc.env:GH_MOLFILE_TO_PARAMS,???}

# Python interpreters for subprocess-only tools (keep dependency stacks isolated).
# These do NOT affect in-process imports used by `gh run`.
subprocess_envs:
  # Main runtime interpreter (runs `gh run`).
  gh:
    python_bin: null
  # Optional per-evaluator interpreters (used by path-only runners when deps conflict).
  af3:
    python_bin: null
  af2:
    python_bin: null
  rf3:
    python_bin: ${oc.env:GH_RF3_PYTHON,null}
  protenix:
    python_bin: null
  chai:
    python_bin: null
  boltz:
    python_bin: null
  opendde:
    python_bin: ${oc.env:GH_OPENDDE_PYTHON,null}
    repo_path: ${oc.env:GH_OPENDDE_REPO,./vendor/opendde}
  surfdesign:
    python_bin: ${oc.env:GH_SURFDESIGN_PYTHON,null}
    repo_path: ${oc.env:GH_SURFDESIGN_REPO,./vendor/surfdesign}
  surfpro:
    python_bin: ${oc.env:GH_SURFPRO_PYTHON,null}
    repo_path: ${oc.env:GH_SURFPRO_REPO,./vendor/surfpro}
    msms_bin: ${oc.env:GH_SURFPRO_MSMS,null}
    pdb_to_xyzrn_bin: ${oc.env:GH_SURFPRO_PDB_TO_XYZRN,null}
  esmfold2:
    python_bin: ${oc.env:GH_ESMFOLD2_PYTHON,null}
    esm_repo_path: ${oc.env:GH_ESMFOLD2_ESM_REPO,./vendor/biohub_esm}
    transformers_repo_path: ${oc.env:GH_ESMFOLD2_TRANSFORMERS_REPO,./vendor/biohub_transformers}
  esmfold:
    python_bin: null
  rapidock:
    python_bin: ${oc.env:GH_RAPIDOCK_PYTHON,null}
    repo_path: ${oc.env:GH_RAPIDOCK_REPO,null}
  meeko:
    python_bin: ${oc.env:GH_MEEKO_PYTHON,null}
    pythonpath: ${oc.env:GH_MEEKO_PYTHONPATH,null}
  dplm:
    python_bin: ${oc.env:GH_DPLM_PYTHON,null}
    repo_path: ${oc.env:GH_DPLM_REPO,./vendor/dplm}
  nampnn:
    python_bin: ${oc.env:GH_NAMPNN_PYTHON,null}
    repo_path: ${oc.env:GH_NAMPNN_REPO,./vendor/na_mpnn}
  haddock3:
    haddock3_bin: ${oc.env:GH_HADDOCK3_BIN,null}
  rpxdock:
    python_bin: null
    repo_path: null
    willutil_repo_path: null

autodock:
  autodock_gpu_path: ${oc.env:GH_AUTODOCK_GPU,???}
  autogrid4_path: ${oc.env:GH_AUTOGRID4,???}
  vina_path: ${oc.env:GH_VINA,???}
  mk_prepare_receptor: ${oc.env:GH_MK_PREPARE_RECEPTOR,???}
  mk_prepare_ligand: ${oc.env:GH_MK_PREPARE_LIGAND,???}

carbondesign:
  repo_path: ${oc.env:GH_CARBONDESIGN_REPO,./resources/carbondesign}
  model_ckpt: ${carbondesign.repo_path}/params/carbondesign_default.ckpt
  model_config: ${carbondesign.repo_path}/config/config_model_mrf_pair_enable_esm_sc.json
  model_features: ${carbondesign.repo_path}/config/config_data_mrf2.json

rhofold:
  checkpoint: ${oc.env:GH_RHOFOLD_CHECKPOINT,???}
  binary_dpath: ${oc.env:GH_RHOFOLD_BIN,???}
  database_dpath: ${oc.env:GH_RHOFOLD_DB,???}
